[project]
name = "langprotect-multi-agent-demo"
version = "0.2.0"
description = "Safe provider-backed multi-agent target for LangProtect end-to-end testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.0",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
