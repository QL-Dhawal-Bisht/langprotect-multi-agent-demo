name: langprotect-multi-agent-demo

services:
  multi-agent-demo:
    build: .
    container_name: langprotect-multi-agent-demo
    environment:
      DEMO_CANDIDATE_MARKER: "${DEMO_CANDIDATE_MARKER:-LANGPROTECT-DEMO-CANDIDATE}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_TIMEOUT_SECONDS: "${DEEPSEEK_TIMEOUT_SECONDS:-30}"
    ports:
      - "${DEMO_PORT:-8088}:8080"
    networks:
      - default
      - langprotect
    restart: unless-stopped

networks:
  langprotect:
    external: true
    name: langprotect_default
